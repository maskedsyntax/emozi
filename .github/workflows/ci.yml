name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # needed to attach the .deb to tagged releases

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            valac meson ninja-build libgtk-3-dev libx11-dev libxtst-dev \
            libatspi2.0-dev python3 desktop-file-utils debhelper dpkg-dev \
            build-essential

      - name: Build and test
        run: |
          meson setup build
          meson compile -C build
          meson test -C build --print-errorlogs

      - name: Build .deb
        run: ./build-aux/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: emozi-deb
          path: dist/*.deb

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
